<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#17130f" />
  <meta name="description" content="三个可以进入和停留的沉浸式环境声音空间。" />
  <title>山野来信 · Ambient Space</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ctext y=%2725%27 font-size=%2724%27%3E%E2%98%95%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app" id="app">
    <section class="home-view" id="homeView" aria-labelledby="homeTitle">
      <div class="home-shell">
        <header class="home-header">
          <p class="eyebrow">山野来信</p>
          <h1 id="homeTitle">今天想去哪里待一会儿？</h1>
          <p>选一处安静的地方，让时间慢下来。</p>
        </header>

        <section class="home-section featured-section" aria-labelledby="featuredTitle">
          <div class="section-heading"><div><span class="section-mark" aria-hidden="true">✦</span><h2 id="featuredTitle">今日推荐</h2></div></div>
          <div id="featuredCard"></div>
        </section>

        <section class="home-section recent-section" id="recentSection" aria-labelledby="recentTitle" hidden>
          <div class="section-heading"><div><span class="section-mark" aria-hidden="true">◷</span><h2 id="recentTitle">最近停留</h2></div></div>
          <div class="horizontal-cards recent-cards" id="recentList"></div>
        </section>
        <section class="home-section favorites-section" id="favoritesSection" aria-labelledby="favoritesTitle" hidden>
          <div class="section-heading"><div><span class="section-mark" aria-hidden="true">♡</span><h2 id="favoritesTitle">我的收藏</h2></div></div>
          <div class="horizontal-cards state-cards" id="favoritesList"></div>
        </section>

        <div id="categorySections"></div>

        <button class="all-spaces-button" id="allSpacesButton" type="button">
          <span>查看全部空间</span><span aria-hidden="true">→</span>
        </button>
      </div>
    </section>

    <section class="library-view" id="libraryView" aria-labelledby="libraryTitle" hidden>
      <div class="library-shell">
        <header class="library-header">
          <button class="library-back" id="libraryBackButton" type="button" aria-label="返回首页">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
          </button>
          <div><p class="eyebrow">所有可以停留的地方</p><h1 id="libraryTitle">全部空间</h1></div>
        </header>
        <div class="library-grid" id="libraryGrid"></div>
      </div>
    </section>
    <section class="player-view" id="playerView" aria-label="沉浸式场景" hidden>
      <div class="media-layer" aria-hidden="true">
        <div class="media-ambient" id="mediaAmbient"></div>
        <video id="sceneVideo" autoplay loop muted playsinline preload="auto"></video>
        <div class="scene-vignette"></div>
      </div>
      <header class="player-header controls-layer">
        <button class="round-button" id="backButton" type="button" aria-label="返回场景选择"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg></button>
        <div class="player-heading"><span>正在停留</span><h2 id="playerSceneName"></h2></div>
        <button class="round-button favorite-button" id="favoriteButton" type="button" aria-label="收藏当前场景" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.2S4.5 16 4.5 9.8A4.3 4.3 0 0 1 12 6.9a4.3 4.3 0 0 1 7.5 2.9c0 6.2-7.5 10.4-7.5 10.4z" /></svg></button>
      </header>
      <section class="entry-gate" id="entryGate">
        <div class="entry-copy"><p class="eyebrow">一处安静的空间</p><h2 id="entryName"></h2><p id="entryDescription"></p>
          <button class="enter-button" id="enterButton" type="button"><span>进入这个空间</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l7 6-7 6" /></svg></button>
        </div>
      </section>
      <section class="bottom-controls controls-layer" aria-label="场景控制">
        <div class="control-dock">
          <button class="dock-button play-toggle" id="playButton" type="button" aria-label="播放"><svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l9 6-9 6z" /></svg><svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6v12M16 6v12" /></svg></button>
          <button class="dock-button" id="timerButton" type="button" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="7"/><path d="M12 9v4l2.5 1.5M9 3h6"/></svg><span id="timerLabel">定时</span></button>
          <button class="dock-button" id="soundButton" type="button" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10v4h3l4 3V7L8 10H5zM16 9c1 1 1 5 0 6M19 7c2 2 2 8 0 10"/></svg><span>声音</span></button>
        </div>
      </section>
      <section class="glass-panel timer-panel" id="timerPanel" hidden aria-label="定时关闭">
        <div class="panel-heading"><h3>在多久后安静下来？</h3><button data-close-panel type="button" aria-label="关闭">×</button></div>
        <div class="timer-options"><button type="button" data-timer="0">不定时</button><button type="button" data-timer="15">15 分钟</button><button type="button" data-timer="30">30 分钟</button><button type="button" data-timer="60">60 分钟</button></div>
        <p class="panel-note">结束前 30 秒，空间会慢慢安静下来。</p>
      </section>
      <section class="glass-panel sound-panel" id="soundPanel" hidden aria-label="声音调节">
        <div class="panel-heading"><div><span>声音空间</span><h3>找到舒服的距离</h3></div><button data-close-panel type="button" aria-label="关闭">×</button></div>
        <div class="presets" id="presetButtons" aria-label="声音预设"></div><div class="track-controls" id="trackControls"></div>
      </section>
      <section class="ended-state" id="endedState" hidden><div><p>这一段停留结束了</p><h2>房间已经安静下来</h2><div class="ended-actions"><button id="restartButton" type="button">再待一会儿</button><button id="endedHomeButton" type="button">回到首页</button></div></div></section>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </section>
  </main>
  <script src="./scenes.js"></script>
  <script src="./app.js" defer></script>
</body>
</html>
